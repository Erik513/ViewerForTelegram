<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer for Telegram</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="bar">
    <button id="settings" title="Settings">&#9881;</button>

    <label>Group / channel
      <select id="group" disabled></select>
    </label>

    <label>Time range
      <select id="range">
        <option value="3">Last 3 days</option>
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </label>

    <label class="vol">&#128266;
      <input id="volume" type="range" min="0" max="100">
    </label>

    <input id="search" type="search" placeholder="Filter ...">
    <span id="cache">Cache: –</span>
    <span id="status">Connecting ...</span>
  </div>

  <div class="table-wrap">
    <table id="songs">
      <colgroup>
        <col class="col-date">
        <col class="col-song">
        <col class="col-file">
      </colgroup>
      <thead>
        <tr>
          <th data-key="date">Date</th>
          <th data-key="title">Song</th>
          <th data-key="none" class="no-sort">File</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No audio files in this time range.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
